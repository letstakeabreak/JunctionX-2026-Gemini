openapi: 3.1.0
info:
  title: STANDBY API
  version: 0.2.0
  summary: Stage-production document verification and 2D evidence API
  description: |
    API for the STANDBY PRD v0.5 two-screen workflow. Sources are immutable and
    AI outputs are non-authoritative. Reviewed compiled events may be visualized
    as EVIDENCE PREVIEW before correction; FINAL and CONSISTENT naming remain
    locked until a new source hash passes aggregate re-verification.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: System
  - name: Productions
  - name: Cases
  - name: Sources
  - name: Extraction
  - name: Reviews
  - name: Verification
  - name: Proposals
  - name: Simulation
  - name: Operations
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Service is ready or degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/me:
    get:
      tags: [System]
      operationId: getCurrentActor
      x-maturity: p1
      responses:
        '200':
          description: Current actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/capabilities:
    get:
      tags: [System]
      operationId: getCapabilities
      responses:
        '200':
          description: Runtime capability gates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
  /v1/productions:
    post:
      tags: [Productions]
      operationId: createProduction
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductionRequest'
      responses:
        '201':
          description: Production created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Production'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Productions]
      operationId: listProductions
      x-maturity: p1
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Production list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionList'
  /v1/productions/{production_id}:
    parameters:
      - $ref: '#/components/parameters/ProductionId'
    get:
      tags: [Productions]
      operationId: getProduction
      responses:
        '200':
          description: Production
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Production'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Productions]
      operationId: updateProduction
      x-maturity: p1
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductionRequest'
      responses:
        '200':
          description: Updated production
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Production'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/productions/{production_id}/cases:
    parameters:
      - $ref: '#/components/parameters/ProductionId'
    post:
      tags: [Cases]
      operationId: createCase
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201':
          description: Case and initial revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCaseResponse'
    get:
      tags: [Cases]
      operationId: listCases
      x-maturity: p1
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Case list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseList'
  /v1/cases/{case_id}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Cases]
      operationId: getCase
      responses:
        '200':
          description: Verification case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationCase'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Cases]
      operationId: purgeCase
      x-maturity: p1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          description: Purge operation accepted
          headers:
            Operation-Location: {$ref: '#/components/headers/OperationLocation'}
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/cases/{case_id}/revisions:
    get:
      tags: [Cases]
      operationId: listCaseRevisions
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Parent-child revision lineage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
  /v1/cases/{case_id}/audit-events:
    get:
      tags: [Cases]
      operationId: listAuditEvents
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Append-only audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
  /v1/revisions/{revision_id}:
    get:
      tags: [Cases]
      operationId: getRevision
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Immutable case revision snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseRevision'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/revisions/{revision_id}/sources/{slot_role}:
    put:
      tags: [Sources]
      operationId: uploadSourceToSlot
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/SlotRole'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SourceUploadRequest'
      responses:
        '201':
          description: Immutable source document created or deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDocument'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/revisions/{revision_id}/source-manifest:
    get:
      tags: [Sources]
      operationId: getSourceManifest
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Current three-slot source manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceManifest'
  /v1/revisions/{revision_id}/source-confirmation:
    post:
      tags: [Sources]
      operationId: confirmSources
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmSourcesRequest'
      responses:
        '200':
          description: Confirmed immutable source manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceManifest'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/revisions/{revision_id}/master-reuploads:
    post:
      tags: [Sources]
      operationId: reuploadMasterCue
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MasterReuploadRequest'
      responses:
        '202':
          description: Child revision and master extraction operation created
          headers:
            Operation-Location: {$ref: '#/components/headers/OperationLocation'}
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterReuploadAccepted'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/documents/{document_id}:
    get:
      tags: [Sources]
      operationId: getSourceDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Immutable document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDocument'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/source-refs/{source_ref_id}:
    get:
      tags: [Sources]
      operationId: getSourceReference
      parameters:
        - $ref: '#/components/parameters/SourceRefId'
      responses:
        '200':
          description: Source reference and safe locator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceReference'
  /v1/documents/{document_id}/pages/{page_number}:
    get:
      tags: [Sources]
      operationId: getDocumentPage
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: Short-lived signed render URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRender'
  /v1/revisions/{revision_id}/extraction-runs:
    get:
      tags: [Extraction]
      operationId: listExtractionRuns
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Extraction run history for this immutable revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionRunList'
    post:
      tags: [Extraction]
      operationId: startExtraction
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartExtractionRequest'
      responses:
        '202':
          description: Extraction operation accepted
          headers:
            Operation-Location: {$ref: '#/components/headers/OperationLocation'}
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/extraction-runs/{run_id}:
    get:
      tags: [Extraction]
      operationId: getExtractionRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Role-separated extraction run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionRun'
  /v1/revisions/{revision_id}/facts:
    get:
      tags: [Extraction]
      operationId: listFacts
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - name: slot_role
          in: query
          schema:
            $ref: '#/components/schemas/SlotRole'
        - name: review_status
          in: query
          schema:
            $ref: '#/components/schemas/ReviewStatus'
        - name: fact_type
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Fact list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactList'
  /v1/facts/{fact_id}:
    get:
      tags: [Extraction]
      operationId: getFact
      parameters:
        - $ref: '#/components/parameters/FactId'
      responses:
        '200':
          description: Fact with immutable raw and reviewed projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fact'
  /v1/facts/{fact_id}/reviews:
    get:
      tags: [Reviews]
      operationId: listFactReviews
      parameters:
        - $ref: '#/components/parameters/FactId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Append-only fact review history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRecordList'
    post:
      tags: [Reviews]
      operationId: reviewFact
      parameters:
        - $ref: '#/components/parameters/FactId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactReviewRequest'
      responses:
        '201':
          description: Review record appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRecord'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/revisions/{revision_id}/fact-reviews:batch:
    post:
      tags: [Reviews]
      operationId: reviewFactsBatch
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchFactReviewRequest'
      responses:
        '201':
          description: Review records appended atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRecordList'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/revisions/{revision_id}/event-links:
    get:
      tags: [Reviews]
      operationId: listEventLinks
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EventLinkStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Event link candidates and decisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventLinkList'
    post:
      tags: [Reviews]
      operationId: createEventLink
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventLinkRequest'
      responses:
        '201':
          description: Human-created event-link candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventLink'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/event-links/{link_id}/decisions:
    get:
      tags: [Reviews]
      operationId: listEventLinkDecisions
      parameters:
        - $ref: '#/components/parameters/LinkId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Append-only event-link review history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRecordList'
    post:
      tags: [Reviews]
      operationId: decideEventLink
      parameters:
        - $ref: '#/components/parameters/LinkId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventLinkDecisionRequest'
      responses:
        '201':
          description: Link decision appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRecord'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/revisions/{revision_id}/stage-graph:
    get:
      tags: [Reviews]
      operationId: getStageGraph
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Named-zone graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageGraph'
  /v1/stage-graph-items/{item_id}/reviews:
    get:
      tags: [Reviews]
      operationId: listStageGraphItemReviews
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Append-only stage item review history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRecordList'
    post:
      tags: [Reviews]
      operationId: reviewStageGraphItem
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageItemReviewRequest'
      responses:
        '201':
          description: Stage item review appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRecord'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/revisions/{revision_id}/authority-decisions:
    get:
      tags: [Reviews]
      operationId: listAuthorityDecisions
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Authority decision list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorityDecisionList'
    post:
      tags: [Reviews]
      operationId: createAuthorityDecision
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthorityDecisionRequest'
      responses:
        '201':
          description: Authority decision appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorityDecision'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/revisions/{revision_id}/review-state:
    get:
      tags: [Reviews]
      operationId: getReviewState
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Canonical version tuple and review completeness used to freeze a review snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewState'
  /v1/revisions/{revision_id}/review-gates/complete:
    post:
      tags: [Reviews]
      operationId: completeReviewGate
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteReviewGateRequest'
      responses:
        '201':
          description: Immutable review snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewSnapshot'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/revisions/{revision_id}/verification-readiness:
    get:
      tags: [Verification]
      operationId: getVerificationReadiness
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - name: review_snapshot_id
          in: query
          required: true
          schema: {type: string}
        - name: rule_set_version
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Start eligibility and canonical input fingerprint for the selected snapshot and rule set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationReadiness'
  /v1/revisions/{revision_id}/verification-runs:
    get:
      tags: [Verification]
      operationId: listVerificationRuns
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Verification run history for this immutable revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRunList'
    post:
      tags: [Verification]
      operationId: startVerification
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartVerificationRequest'
      responses:
        '202':
          description: Compile and verification operation accepted
          headers:
            Operation-Location: {$ref: '#/components/headers/OperationLocation'}
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/verification-runs/{run_id}:
    get:
      tags: [Verification]
      operationId: getVerificationRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Verification run and aggregate gate summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRun'
  /v1/revisions/{revision_id}/compiled-events:
    get:
      tags: [Verification]
      operationId: listCompiledEvents
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - name: compile_run_id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Reviewed compiled event graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompiledEventList'
  /v1/revisions/{revision_id}/findings:
    get:
      tags: [Verification]
      operationId: listFindings
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - name: verification_run_id
          in: query
          required: true
          schema: {type: string}
        - name: verdict
          in: query
          schema:
            $ref: '#/components/schemas/FindingVerdict'
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/FindingSeverity'
        - name: lifecycle
          in: query
          schema:
            $ref: '#/components/schemas/FindingLifecycle'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Finding list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingList'
  /v1/findings/{finding_id}:
    get:
      tags: [Verification]
      operationId: getFinding
      parameters:
        - $ref: '#/components/parameters/FindingId'
      responses:
        '200':
          description: Deterministic finding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
  /v1/findings/{finding_id}/evidence:
    get:
      tags: [Verification]
      operationId: getFindingEvidence
      parameters:
        - $ref: '#/components/parameters/FindingId'
      responses:
        '200':
          description: Source references used by calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingEvidence'
  /v1/findings/{finding_id}/decisions:
    get:
      tags: [Verification]
      operationId: listFindingDecisions
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Append-only finding classification history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDecisionList'
    post:
      tags: [Verification]
      operationId: decideFinding
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindingDecisionRequest'
      responses:
        '201':
          description: Finding decision appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDecision'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/findings/{finding_id}/exception-decisions:
    get:
      tags: [Verification]
      operationId: listFindingExceptionDecisions
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Append-only exception responsibility decisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionDecisionList'
    post:
      tags: [Verification]
      operationId: decideFindingException
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExceptionDecisionRequest'
      responses:
        '201':
          description: Separate responsibility acceptance appended without changing the deterministic finding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionDecision'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/revisions/{revision_id}/proposals:
    get:
      tags: [Proposals]
      operationId: listProposals
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - name: verification_run_id
          in: query
          required: true
          schema: {type: string}
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProposalStatus'
        - name: proposal_type
          in: query
          schema:
            $ref: '#/components/schemas/ProposalType'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Proposal list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalList'
  /v1/proposals/{proposal_id}:
    get:
      tags: [Proposals]
      operationId: getProposal
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: Discriminated proposal detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeProposal'
  /v1/proposals/{proposal_id}/decisions:
    get:
      tags: [Proposals]
      operationId: listProposalDecisions
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Append-only proposal decision history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDecisionList'
    post:
      tags: [Proposals]
      operationId: decideProposal
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalDecisionRequest'
      responses:
        '201':
          description: Proposal decision appended without source mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDecision'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/revisions/{revision_id}/final-gate:
    get:
      tags: [Simulation]
      operationId: getFinalGate
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Exact server-side gate evaluation used to lock or unlock Final 2D
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalGateEvaluation'
  /v1/revisions/{revision_id}/simulation:
    get:
      tags: [Simulation]
      operationId: getFinalSimulation
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Immutable final 2D simulation manifest and frames
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationManifest'
        '423':
          description: Final gate is locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationLockedResponse'
  /v1/operations/{operation_id}:
    get:
      tags: [Operations]
      operationId: getOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Pollable operation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
  /v1/operations/{operation_id}/cancel:
    post:
      tags: [Operations]
      operationId: cancelOperation
      x-maturity: p1
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Local orchestration cancellation requested; provider job cancellation is not implied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/operations/{operation_id}/events:
    get:
      tags: [Operations]
      operationId: streamOperationEvents
      x-maturity: p1
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Optional server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    OperationLocation:
      description: Pollable STANDBY operation URL.
      schema: {type: string, format: uri-reference}
    RetryAfter:
      description: Suggested seconds before the next poll.
      schema: {type: integer, minimum: 1}
  parameters:
    ProductionId:
      name: production_id
      in: path
      required: true
      schema: {type: string}
    CaseId:
      name: case_id
      in: path
      required: true
      schema: {type: string}
    RevisionId:
      name: revision_id
      in: path
      required: true
      schema: {type: string}
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: {type: string}
    SourceRefId:
      name: source_ref_id
      in: path
      required: true
      schema: {type: string}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string}
    FactId:
      name: fact_id
      in: path
      required: true
      schema: {type: string}
    LinkId:
      name: link_id
      in: path
      required: true
      schema: {type: string}
    ItemId:
      name: item_id
      in: path
      required: true
      schema: {type: string}
    FindingId:
      name: finding_id
      in: path
      required: true
      schema: {type: string}
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema: {type: string}
    OperationId:
      name: operation_id
      in: path
      required: true
      schema: {type: string}
    PageNumber:
      name: page_number
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    SlotRole:
      name: slot_role
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SlotRole'
    Cursor:
      name: cursor
      in: query
      schema: {type: [string, 'null']}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PreconditionFailed:
      description: Resource version changed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PreconditionRequired:
      description: Required If-Match header is missing
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PayloadTooLarge:
      description: File exceeds the server or selected pipeline limit
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    UnsupportedMediaType:
      description: Unsupported source format for role
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    UnprocessableEntity:
      description: Domain contract violation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ServiceUnavailable:
      description: Required dependency unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    Timestamp:
      type: string
      format: date-time
    ResourceVersion:
      type: string
      minLength: 1
    Sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    SlotRole:
      type: string
      enum: [SCRIPT, MASTER_CUE, STAGE_SPEC]
    Origin:
      type: string
      enum: [REAL_REFERENCE, USER_PROVIDED, CONTROLLED_FIXTURE, MUTATED_FIXTURE, DERIVED, AI_PROPOSED]
    ReviewStatus:
      type: string
      enum: [UNREVIEWED, REVIEWED, REJECTED]
    WorkflowStatus:
      type: string
      enum:
        - DRAFT
        - SOURCE_CONFIRMATION
        - EXTRACTING
        - EXTRACTION_REVIEW
        - READY_TO_VERIFY
        - FINDINGS_REVIEW
        - AWAITING_MASTER_REUPLOAD
        - REVERIFYING
        - COMPLETE
        - BLOCKED_ROLE_MISMATCH
        - BLOCKED_MISSING_INPUT
        - FAILED
        - STALE
    VerificationStatus:
      type: string
      enum: [NOT_RUN, RUNNING, FINDINGS_PRESENT, CONSISTENT, CONSISTENT_WITH_EXCEPTIONS, INSUFFICIENT, FAILED, STALE]
    SimulationStatus:
      type: string
      enum: [LOCKED, READY, READY_WITH_EXCEPTIONS, FAILED, STALE]
    OperationStatus:
      type: string
      enum: [QUEUED, RUNNING, WAITING_FOR_REVIEW, SUCCEEDED, FAILED, CANCELLED]
    FindingVerdict:
      type: string
      enum: [VIOLATION, REVIEW, INSUFFICIENT, NO_CONFLICT_WITHIN_DECLARED_CONSTRAINTS]
    FindingSeverity:
      type: string
      enum: [ERROR, WARNING, INFO]
    FindingLifecycle:
      type: string
      enum: [OPEN, CLOSED_BY_REVERIFICATION]
    ProposalType:
      type: string
      enum: [MASTER_CUE_EDIT_SUGGESTION, RESOLUTION_OPTIONS, CLARIFICATION_REQUEST, MISSING_INPUT_REQUEST]
    ProposalStatus:
      type: string
      enum: [PROPOSED, ACCEPTED, REJECTED, SUPERSEDED]
    EventLinkStatus:
      type: string
      enum: [PROPOSED, APPROVED, REJECTED, STALE]
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: {type: string, const: ok}
    ReadinessResponse:
      type: object
      required: [status, dependencies]
      properties:
        status: {type: string, enum: [ready, degraded]}
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ready, degraded, unavailable]
    Actor:
      type: object
      required: [actor_id, display_name, workspace_id]
      properties:
        actor_id: {type: string}
        display_name: {type: string}
        workspace_id: {type: string}
        roles:
          type: array
          items: {type: string}
    Capabilities:
      type: object
      required: [api_version, extraction_pipeline_versions, rule_set_versions, source_slots, upstage_polling, upstage_webhook, item_location_verified, cache_fallback, solar_explanation, config_pin_verified]
      properties:
        api_version: {type: string}
        extraction_pipeline_versions:
          type: array
          minItems: 1
          items: {type: string}
        rule_set_versions:
          type: array
          minItems: 1
          items: {type: string}
        source_slots:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: '#/components/schemas/SourceSlotCapability'}
        upstage_polling: {type: boolean, const: true}
        upstage_webhook: {type: boolean, default: false}
        item_location_verified: {type: boolean}
        cache_fallback: {type: boolean}
        solar_explanation: {type: boolean}
        config_pin_verified:
          type: boolean
          description: True only after config_id was sent explicitly and the deployment passed a live pinning smoke test.
    SourceSlotCapability:
      type: object
      required: [slot_role, media_types, max_upload_bytes]
      properties:
        slot_role: {$ref: '#/components/schemas/SlotRole'}
        media_types:
          type: array
          minItems: 1
          items: {type: string}
        max_upload_bytes: {type: integer, minimum: 1}
        max_pages: {type: [integer, 'null'], minimum: 1}
    Production:
      type: object
      required: [production_id, name, created_at, updated_at, resource_version]
      properties:
        production_id: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        resource_version: {$ref: '#/components/schemas/ResourceVersion'}
    CreateProductionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: [string, 'null'], maxLength: 2000}
    UpdateProductionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: [string, 'null'], maxLength: 2000}
    ProductionList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Production'}
        next_cursor: {type: [string, 'null']}
    CaseScope:
      type: object
      required: [kind, description]
      properties:
        kind: {type: string, enum: [HERO_SEGMENT, FULL_PRODUCTION]}
        description: {type: string}
        source_marker: {type: [string, 'null']}
    VerificationCase:
      type: object
      required: [case_id, production_id, label, scope, active_revision_id, active_workflow_status, active_verification_status, active_simulation_status, resource_version, created_at, updated_at]
      properties:
        case_id: {type: string}
        production_id: {type: string}
        label: {type: string}
        scope: {$ref: '#/components/schemas/CaseScope'}
        active_revision_id: {type: string}
        active_workflow_status: {$ref: '#/components/schemas/WorkflowStatus'}
        active_verification_status: {$ref: '#/components/schemas/VerificationStatus'}
        active_simulation_status: {$ref: '#/components/schemas/SimulationStatus'}
        aggregate_gate: {$ref: '#/components/schemas/AggregateGate'}
        resource_version: {$ref: '#/components/schemas/ResourceVersion'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
      allOf:
        - if:
            properties: {active_simulation_status: {const: READY}}
          then:
            properties:
              active_workflow_status: {const: COMPLETE}
              active_verification_status: {const: CONSISTENT}
        - if:
            properties: {active_simulation_status: {const: READY_WITH_EXCEPTIONS}}
          then:
            properties:
              active_workflow_status: {const: COMPLETE}
              active_verification_status: {const: CONSISTENT_WITH_EXCEPTIONS}
    CreateCaseRequest:
      type: object
      additionalProperties: false
      required: [label, scope]
      properties:
        label: {type: string, minLength: 1, maxLength: 200}
        scope: {$ref: '#/components/schemas/CaseScope'}
    CreateCaseResponse:
      type: object
      required: [case, initial_revision]
      properties:
        case: {$ref: '#/components/schemas/VerificationCase'}
        initial_revision: {$ref: '#/components/schemas/CaseRevision'}
    CaseList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/VerificationCase'}
        next_cursor: {type: [string, 'null']}
    CaseRevision:
      type: object
      required: [revision_id, case_id, label, workflow_status, verification_status, simulation_status, source_manifest, created_at, resource_version]
      properties:
        revision_id: {type: string}
        case_id: {type: string}
        parent_revision_id: {type: [string, 'null']}
        label: {type: string}
        workflow_status: {$ref: '#/components/schemas/WorkflowStatus'}
        verification_status: {$ref: '#/components/schemas/VerificationStatus'}
        simulation_status: {$ref: '#/components/schemas/SimulationStatus'}
        source_manifest: {$ref: '#/components/schemas/SourceManifest'}
        review_snapshot_id: {type: [string, 'null']}
        compile_run_id: {type: [string, 'null']}
        verification_run_id: {type: [string, 'null']}
        aggregate_gate: {$ref: '#/components/schemas/AggregateGate'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        resource_version: {$ref: '#/components/schemas/ResourceVersion'}
      allOf:
        - if:
            properties: {simulation_status: {const: READY}}
          then:
            properties:
              workflow_status: {const: COMPLETE}
              verification_status: {const: CONSISTENT}
        - if:
            properties: {simulation_status: {const: READY_WITH_EXCEPTIONS}}
          then:
            properties:
              workflow_status: {const: COMPLETE}
              verification_status: {const: CONSISTENT_WITH_EXCEPTIONS}
    RevisionList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CaseRevision'}
        next_cursor: {type: [string, 'null']}
    SourceUploadRequest:
      type: object
      required: [file, origin, revision_label]
      properties:
        file: {type: string, format: binary}
        origin: {$ref: '#/components/schemas/Origin'}
        revision_label: {type: string, minLength: 1, maxLength: 100}
    SourceDocument:
      type: object
      required: [document_id, slot_role, filename, media_type, size_bytes, sha256, origin, revision_label, immutable, review_status, created_at]
      properties:
        document_id: {type: string}
        parent_document_id: {type: [string, 'null']}
        slot_role: {$ref: '#/components/schemas/SlotRole'}
        filename: {type: string}
        media_type: {type: string}
        size_bytes: {type: integer, minimum: 0}
        page_count: {type: [integer, 'null'], minimum: 1}
        sha256: {$ref: '#/components/schemas/Sha256'}
        origin: {$ref: '#/components/schemas/Origin'}
        revision_label: {type: string}
        immutable: {type: boolean, const: true}
        role_sanity_status: {type: string, enum: [PENDING, PASSED, ROLE_MISMATCH_REVIEW]}
        review_status: {$ref: '#/components/schemas/ReviewStatus'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    SourceManifestItem:
      type: object
      required: [slot_role, document_id, sha256, origin, confirmed]
      properties:
        slot_role: {$ref: '#/components/schemas/SlotRole'}
        document_id: {type: string}
        sha256: {$ref: '#/components/schemas/Sha256'}
        origin: {$ref: '#/components/schemas/Origin'}
        confirmed: {type: boolean}
    SourceManifest:
      type: object
      required: [revision_id, sources, source_selection_confirmed, manifest_hash, resource_version]
      properties:
        revision_id: {type: string}
        sources:
          type: array
          minItems: 0
          maxItems: 3
          items: {$ref: '#/components/schemas/SourceManifestItem'}
        source_selection_confirmed: {type: boolean}
        manifest_hash: {type: [string, 'null']}
        confirmed_at: {type: [string, 'null'], format: date-time}
        resource_version: {$ref: '#/components/schemas/ResourceVersion'}
      allOf:
        - if:
            required: [source_selection_confirmed]
            properties:
              source_selection_confirmed: {const: true}
          then:
            properties:
              sources:
                minItems: 3
                maxItems: 3
                items:
                  allOf:
                    - $ref: '#/components/schemas/SourceManifestItem'
                    - required: [confirmed]
                      properties:
                        confirmed: {const: true}
                allOf:
                  - contains:
