          uniqueItems: true
          items: {type: string}
    Finding:
      type: object
      required: [finding_id, revision_id, verification_run_id, finding_lineage_key, segment_lineage, entity_ids, rule_id, type, verdict, severity, origin, evidence_origins, evidence_state, source_refs, assumptions, lifecycle, resource_version]
      properties:
        finding_id: {type: string}
        revision_id: {type: string}
        verification_run_id: {type: string}
        finding_lineage_key: {type: string}
        segment_lineage: {$ref: '#/components/schemas/SegmentLineage'}
        rule_id: {type: string}
        type: {type: string}
        verdict: {$ref: '#/components/schemas/FindingVerdict'}
        severity: {$ref: '#/components/schemas/FindingSeverity'}
        origin: {type: string, const: DERIVED}
        evidence_origins:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/Origin'}
        evidence_state: {type: string, enum: [UNREVIEWED, REVIEWED, INCOMPLETE]}
        message: {type: [string, 'null']}
        calculation: {type: [string, 'null']}
        calculation_trace:
          type: array
          items: {type: object, additionalProperties: true}
        entity_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
        source_refs:
          type: array
          minItems: 1
          items: {type: string}
        assumptions:
          type: array
          items: {type: string}
        lifecycle: {$ref: '#/components/schemas/FindingLifecycle'}
        detected_revision_id: {type: string}
        resolved_revision_id: {type: [string, 'null']}
        resource_version: {$ref: '#/components/schemas/ResourceVersion'}
    FindingList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Finding'}
        next_cursor: {type: [string, 'null']}
    FindingEvidence:
      type: object
      required: [finding_id, calculation_trace, sources]
      properties:
        finding_id: {type: string}
        calculation_trace:
          type: array
          items: {type: object, additionalProperties: true}
        sources:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/SourceReference'}
    FindingDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, note, source_refs]
      properties:
        decision: {type: string, enum: [ACTUAL_CONFLICT, FALSE_POSITIVE, NEEDS_CLARIFICATION, EVIDENCE_INSUFFICIENT]}
        note: {type: string, minLength: 1, maxLength: 4000}
        source_refs:
          type: array
          minItems: 1
          items: {type: string}
    ExceptionDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, rationale, source_refs, expected_verification_run_id, expected_input_fingerprint]
      properties:
        decision: {type: string, const: ACCEPT_EXCEPTION}
        rationale: {type: string, minLength: 1, maxLength: 4000}
        source_refs:
          type: array
          minItems: 1
          items: {type: string}
        expected_verification_run_id: {type: string}
        expected_input_fingerprint: {$ref: '#/components/schemas/Sha256'}
    ExceptionDecision:
      type: object
      required: [exception_decision_id, finding_id, verification_run_id, input_fingerprint, decision, rationale, source_refs, approver_id, created_at]
      properties:
        exception_decision_id: {type: string}
        finding_id: {type: string}
        verification_run_id: {type: string}
        input_fingerprint: {$ref: '#/components/schemas/Sha256'}
        decision: {type: string, const: ACCEPT_EXCEPTION}
        rationale: {type: string}
        source_refs:
          type: array
          minItems: 1
          items: {type: string}
        approver_id: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    ExceptionDecisionList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ExceptionDecision'}
        next_cursor: {type: [string, 'null']}
    ProposalOption:
      type: object
      required: [text, source_refs, assumptions, non_authoritative]
      properties:
        text: {type: string}
        source_refs:
          type: array
          minItems: 1
          items: {type: string}
        assumptions:
          type: array
          items: {type: string}
        non_authoritative: {type: boolean, const: true}
    ProposalBase:
      type: object
      required: [proposal_id, proposal_type, revision_id, verification_run_id, input_fingerprint, finding_id, base_document_hash, base_source_snapshot_digest, rationale, source_refs, impact_refs, status, generated_by, resource_version]
      properties:
        proposal_id: {type: string}
        proposal_type: {$ref: '#/components/schemas/ProposalType'}
        revision_id: {type: string}
        verification_run_id: {type: string}
        input_fingerprint: {$ref: '#/components/schemas/Sha256'}
        finding_id: {type: string}
        target_document_id: {type: [string, 'null']}
        target_locator: {anyOf: [{$ref: '#/components/schemas/SheetCellLocator'}, {type: 'null'}]}
        base_document_hash: {$ref: '#/components/schemas/Sha256'}
        base_source_snapshot_digest: {$ref: '#/components/schemas/Sha256'}
        current_value: {}
        suggested_value: {}
        rationale: {type: string}
        authority_basis: {type: [string, 'null']}
        authority_decision_id: {type: [string, 'null']}
        source_refs:
          type: array
          minItems: 1
          items: {type: string}
        impact_refs:
          type: array
          items: {type: string}
        status: {$ref: '#/components/schemas/ProposalStatus'}
        generated_by: {$ref: '#/components/schemas/GenerationProvenance'}
        resource_version: {$ref: '#/components/schemas/ResourceVersion'}
    MasterCueEditSuggestion:
      allOf:
        - $ref: '#/components/schemas/ProposalBase'
        - type: object
          required: [target_document_id, target_locator, current_value, suggested_value, authority_basis, authority_decision_id]
          properties:
            proposal_type: {type: string, const: MASTER_CUE_EDIT_SUGGESTION}
            target_document_id: {type: string, minLength: 1}
            target_locator: {$ref: '#/components/schemas/SheetCellLocator'}
            current_value:
              not: {type: 'null'}
            suggested_value:
              not: {type: 'null'}
            authority_basis: {type: string, minLength: 1}
            authority_decision_id: {type: string, minLength: 1}
    ResolutionOptions:
      allOf:
        - $ref: '#/components/schemas/ProposalBase'
        - type: object
          required: [options, suggested_value]
          properties:
            proposal_type: {type: string, const: RESOLUTION_OPTIONS}
            suggested_value: {type: 'null'}
            options:
              type: array
              minItems: 1
              items: {$ref: '#/components/schemas/ProposalOption'}
    ClarificationRequest:
      allOf:
        - $ref: '#/components/schemas/ProposalBase'
        - type: object
          required: [question, conflicting_source_refs, suggested_value]
          properties:
            proposal_type: {type: string, const: CLARIFICATION_REQUEST}
            question: {type: string}
            conflicting_source_refs:
              type: array
              minItems: 2
              items: {type: string}
            suggested_value: {type: 'null'}
    MissingInputRequest:
      allOf:
        - $ref: '#/components/schemas/ProposalBase'
        - type: object
          required: [missing_fact_type, requested_evidence, suggested_value]
          properties:
            proposal_type: {type: string, const: MISSING_INPUT_REQUEST}
            missing_fact_type: {type: string}
            requested_evidence: {type: string}
            suggested_value: {type: 'null'}
    ChangeProposal:
      oneOf:
        - $ref: '#/components/schemas/MasterCueEditSuggestion'
        - $ref: '#/components/schemas/ResolutionOptions'
        - $ref: '#/components/schemas/ClarificationRequest'
        - $ref: '#/components/schemas/MissingInputRequest'
      discriminator:
        propertyName: proposal_type
        mapping:
          MASTER_CUE_EDIT_SUGGESTION: '#/components/schemas/MasterCueEditSuggestion'
          RESOLUTION_OPTIONS: '#/components/schemas/ResolutionOptions'
          CLARIFICATION_REQUEST: '#/components/schemas/ClarificationRequest'
          MISSING_INPUT_REQUEST: '#/components/schemas/MissingInputRequest'
    ProposalList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ChangeProposal'}
        next_cursor: {type: [string, 'null']}
    ProposalDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, note, expected_verification_run_id, expected_input_fingerprint, expected_base_document_hash, expected_source_snapshot_digest]
      properties:
        decision: {type: string, enum: [ACCEPT, REJECT]}
        note: {type: string, minLength: 1, maxLength: 4000}
        expected_verification_run_id: {type: string}
        expected_input_fingerprint: {$ref: '#/components/schemas/Sha256'}
        expected_base_document_hash: {$ref: '#/components/schemas/Sha256'}
        expected_source_snapshot_digest: {$ref: '#/components/schemas/Sha256'}
    ReviewDecision:
      type: object
      required: [decision_id, subject_type, subject_id, decision, note, actor_id, created_at]
      properties:
        decision_id: {type: string}
        subject_type: {type: string, enum: [FINDING, PROPOSAL]}
        subject_id: {type: string}
        decision: {type: string}
        note: {type: string}
        actor_id: {type: string}
        source_refs:
          type: array
          items: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    ReviewDecisionList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ReviewDecision'}
        next_cursor: {type: [string, 'null']}
    GenerationProvenance:
      type: object
      required: [method, prompt_version, finding_revision_id, postprocessed]
      properties:
        method: {type: string}
        provider: {type: [string, 'null']}
        model: {type: [string, 'null']}
        model_config_id: {type: [string, 'null']}
        prompt_version: {type: string}
        finding_revision_id: {type: string}
        input_hash: {type: [string, 'null']}
        postprocessed: {type: boolean, const: true}
    SheetCellLocator:
      type: object
      required: [kind, document_id, sheet, row, field]
      properties:
        kind: {type: string, const: SHEET_CELL}
        document_id: {type: string}
        sheet: {type: string}
        row: {type: integer, minimum: 1}
        field: {type: string}
        source_quote: {type: [string, 'null']}
    PageQuoteLocator:
      type: object
      required: [kind, document_id, page, source_quote]
      properties:
        kind: {type: string, const: PAGE_QUOTE}
        document_id: {type: string}
        page: {type: integer, minimum: 1}
        source_quote: {type: string}
    TableElementLocator:
      type: object
      required: [kind, document_id, page, element_id, source_quote, location_quality]
      properties:
        kind: {type: string, const: TABLE_ELEMENT}
        document_id: {type: string}
        page: {type: integer, minimum: 1}
        element_id: {type: string}
        source_quote: {type: string}
        location_quality: {type: string, enum: [VERIFIED_ELEMENT, VERIFIED_WORD, PAGE_QUOTE_ONLY]}
        coordinates:
          type: [array, 'null']
          items: {type: number}
    TextLineLocator:
      type: object
      required: [kind, document_id, start_line, end_line, source_quote]
      properties:
        kind: {type: string, const: TEXT_LINE}
        document_id: {type: string}
        start_line: {type: integer, minimum: 1}
        end_line: {type: integer, minimum: 1}
        source_quote: {type: string}
    SourceReference:
      type: object
      required: [source_ref_id, document_id, slot_role, origin, locator]
      properties:
        source_ref_id: {type: string}
        document_id: {type: string}
        slot_role: {$ref: '#/components/schemas/SlotRole'}
        origin: {$ref: '#/components/schemas/Origin'}
        locator:
          oneOf:
            - $ref: '#/components/schemas/PageQuoteLocator'
            - $ref: '#/components/schemas/SheetCellLocator'
            - $ref: '#/components/schemas/TableElementLocator'
            - $ref: '#/components/schemas/TextLineLocator'
          discriminator:
            propertyName: kind
    PageRender:
      type: object
      required: [document_id, page_number, signed_url, expires_at]
      properties:
        document_id: {type: string}
        page_number: {type: integer, minimum: 1}
        signed_url: {type: string, format: uri}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    SimulationFrame:
      type: object
      required: [event_id, sequence_index, label, time_range, actor_states, crew_states, prop_states, cue_states, active_route_ids, source_refs]
      properties:
        event_id: {type: string}
        sequence_index: {type: integer, minimum: 1}
        label: {type: string}
        time_range: {$ref: '#/components/schemas/TimeRange'}
        actor_states:
          type: array
          items: {$ref: '#/components/schemas/EntityState'}
        crew_states:
          type: array
          items: {$ref: '#/components/schemas/EntityState'}
        prop_states:
          type: array
          items: {$ref: '#/components/schemas/EntityState'}
        cue_states:
          type: array
          items: {$ref: '#/components/schemas/EntityState'}
        active_route_ids:
          type: array
          items: {type: string}
        source_refs:
          type: array
          minItems: 1
          items: {type: string}
    AcceptedException:
      type: object
      required: [exception_decision_id, finding_id, verification_run_id, input_fingerprint, approver_id, rationale, source_refs]
      properties:
        exception_decision_id: {type: string}
        finding_id: {type: string}
        verification_run_id: {type: string}
        input_fingerprint: {$ref: '#/components/schemas/Sha256'}
        approver_id: {type: string}
        rationale: {type: string}
        source_refs:
          type: array
          minItems: 1
          items: {type: string}
    SimulationManifest:
      type: object
      required: [simulation_status, final_revision_id, source_snapshot_digest, input_fingerprint, master_document_hash, stage_graph_version, compile_run_id, verification_run_id, layout_scale, demo_disclaimer, origin_badges, stage_graph, frames, accepted_exceptions]
      properties:
        simulation_status: {type: string, enum: [READY, READY_WITH_EXCEPTIONS]}
        final_revision_id: {type: string}
        source_snapshot_digest: {$ref: '#/components/schemas/Sha256'}
        input_fingerprint: {$ref: '#/components/schemas/Sha256'}
        master_document_hash: {$ref: '#/components/schemas/Sha256'}
        stage_graph_version: {type: string}
        compile_run_id: {type: string}
        verification_run_id: {type: string}
        layout_scale: {type: string, const: NOT_TO_SCALE}
        demo_disclaimer: {type: [string, 'null']}
        origin_badges:
          type: array
          items: {$ref: '#/components/schemas/Origin'}
        stage_graph: {$ref: '#/components/schemas/StageGraph'}
        frames:
          type: array
          minItems: 8
          maxItems: 8
          items: {$ref: '#/components/schemas/SimulationFrame'}
        accepted_exceptions:
          type: array
          items: {$ref: '#/components/schemas/AcceptedException'}
      allOf:
        - if:
            properties:
              simulation_status: {const: READY}
          then:
            properties:
              accepted_exceptions: {maxItems: 0}
        - if:
            properties:
              simulation_status: {const: READY_WITH_EXCEPTIONS}
          then:
            properties:
              accepted_exceptions: {minItems: 1}
    OperationAccepted:
      type: object
      required: [operation_id, status, poll_after_ms, resource_ref]
      properties:
        operation_id: {type: string}
        status: {type: string, const: QUEUED}
        poll_after_ms: {type: integer, minimum: 250}
        resource_ref:
          type: object
          required: [type, id]
          properties:
            type: {type: string}
            id: {type: string}
    Operation:
      type: object
      required: [operation_id, operation_type, status, progress, attempt, created_at, resource_version]
      properties:
        operation_id: {type: string}
        operation_type: {type: string, enum: [SOURCE_UPLOAD, EXTRACTION, VERIFICATION, MASTER_REUPLOAD, CASE_PURGE]}
        status: {$ref: '#/components/schemas/OperationStatus'}
        progress: {type: number, minimum: 0, maximum: 1}
        attempt: {type: integer, minimum: 1}
        poll_after_ms: {type: integer, minimum: 250}
        resource_ref:
          type: [object, 'null']
          additionalProperties: true
        result_source: {type: [string, 'null'], enum: [LIVE, CACHE, null]}
        error: {anyOf: [{$ref: '#/components/schemas/ErrorDetail'}, {type: 'null'}]}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {type: [string, 'null'], format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        resource_version: {$ref: '#/components/schemas/ResourceVersion'}
    AuditEvent:
      type: object
      required: [audit_event_id, case_id, event_type, actor_id, occurred_at, request_id]
      properties:
        audit_event_id: {type: string}
        case_id: {type: string}
        revision_id: {type: [string, 'null']}
        event_type: {type: string}
        actor_id: {type: string}
        subject_type: {type: [string, 'null']}
        subject_id: {type: [string, 'null']}
        before: {type: [object, 'null'], additionalProperties: true}
        after: {type: [object, 'null'], additionalProperties: true}
        request_id: {type: string}
        occurred_at: {$ref: '#/components/schemas/Timestamp'}
    AuditEventList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditEvent'}
        next_cursor: {type: [string, 'null']}
    ErrorDetail:
      type: object
      required: [code, message, request_id, retryable, details]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        retryable: {type: boolean}
        details: {type: object, additionalProperties: true}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/ErrorDetail'}
    SimulationLockedResponse:
      type: object
      required: [error, final_gate]
      properties:
        error: {$ref: '#/components/schemas/ErrorDetail'}
        final_gate: {$ref: '#/components/schemas/FinalGateEvaluation'}
